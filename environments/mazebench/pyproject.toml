[project]
name = "mazebench"
description = "JS-backed ASCII maze benchmark for multi-turn language models."
tags = ["maze", "game", "ascii", "reasoning", "train", "eval"]
version = "0.1.18"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nodejs-wheel==24.16.0",
    "playwright==1.60.0",
    "verifiers==0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "mazebench/**/*.py",
    "mazebench/prompts/*.txt",
    "mazebench/runtime/**/*",
    "mazebench_codex/**/*.py",
    "mazebench_prime_agent/**/*.py",
    "mazebench_tools/**/*.py",
    "README.md",
]

[tool.hatch.build.targets.wheel.force-include]
# Verifiers rebuilds non-colocated Toolsets from this wheel-root project.
"pyproject.toml" = "pyproject.toml"

[tool.hatch.metadata]
allow-direct-references = true

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
