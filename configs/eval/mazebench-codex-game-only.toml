# Run with:
# uv run --project environments/mazebench eval @ configs/eval/mazebench-codex-game-only.toml
model = "openai/gpt-5.4"
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
push = false
rich = false

[env.taskset]
id = "mazebench-tools"
num_examples = 1
start_level_id = "level_HxI"
game_won_gem_count = 100
max_actions = 40
observation_mode = "ascii"
allow_quit = true

[env.agent]
max_turns = 160

[env.agent.harness]
id = "codex"
version = "0.144.5"
multi_agent = false
disabled_tools = [
  "apps",
  "browser_use",
  "computer_use",
  "goals",
  "image_generation",
  "in_app_browser",
  "memories",
  "multi_agent",
  "plugins",
  "remote_plugin",
  "shell_tool",
  "standalone_web_search",
  "tool_search",
  "tool_suggest",
  "workspace_dependencies",
]

[env.agent.runtime]
type = "prime"
vm = true
allow = []
