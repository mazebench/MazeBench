# Run with:
# uv run --project environments/mazebench eval @ configs/eval/mazebench-claude-code-game-only.toml
model = "openai/gpt-5.4"
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
push = false
rich = false

[env.taskset]
id = "mazebench-tools"
num_examples = 1
start_level_id = "level_HxI"
game_won_gem_count = 100
max_actions = 40
observation_mode = "ascii"
allow_quit = true

[env.agent]
max_turns = 160

[env.agent.harness]
id = "claude_code"
version = "2.1.214"
disabled_tools = [
  "Agent",
  "Bash",
  "CronCreate",
  "CronDelete",
  "CronList",
  "CreateGoal",
  "DesignSync",
  "Edit",
  "EnterWorktree",
  "ExitWorktree",
  "Glob",
  "Grep",
  "GetGoal",
  "Monitor",
  "NotebookEdit",
  "PushNotification",
  "Read",
  "RemoteTrigger",
  "ReportFindings",
  "ScheduleWakeup",
  "SendMessage",
  "Skill",
  "SetGoalBudget",
  "Task",
  "TaskCreate",
  "TaskGet",
  "TaskList",
  "TaskOutput",
  "TaskStop",
  "TaskUpdate",
  "ToolSearch",
  "WebFetch",
  "WebSearch",
  "Workflow",
  "Write",
]

[env.agent.runtime]
type = "prime"
vm = true
allow = []
