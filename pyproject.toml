[project]
name = "mazebench"
version = "0.2.19"
description = "Build and play persistent 3D worlds, then benchmark coding agents and Prime Intellect Verifiers against them."
readme = "README_PYPI.md"
license = "MIT"
# The CLI is a stdlib-only launcher (it shells out to Node), so it runs on any
# modern Python. No upper bound: future Python releases should install fine.
requires-python = ">=3.9"
keywords = ["maze", "benchmark", "agents", "world-building", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# The `mazebench` CLI is a launcher that shells out to the bundled Node runtime
# (game engine, website, local-agent runner, replay/video) and, for the Prime
# path, to the `prime`/`uv` CLIs. It has no hard Python dependencies; Node.js
# must be installed on the machine. Install the extra below only when you want
# the Prime Intellect Verifiers integration.
dependencies = []

[project.urls]
Homepage = "https://mazebench.com"
Source = "https://github.com/mazebench/MazeBenchEngine"

[project.optional-dependencies]
# The Prime Verifiers library currently supports >=3.11,<3.14; the marker keeps
# `pip install mazebench[prime]` from failing on other Pythons (the CLI itself
# never imports verifiers — the prime path shells out to the `prime`/`uv` CLIs,
# so everything else works regardless).
prime = [
    "verifiers>=0.3.0,<0.4 ; python_full_version >= '3.11' and python_full_version < '3.14'",
]

[project.scripts]
mazebench = "mazebench_cli:main"
computer = "mazebench_cli.computer:main"
lan = "mazebench_cli.remote:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mazebench_cli"]
# The staged Node runtime (scripts/build-python-runtime.js writes it) is
# gitignored, so it must be forced into the build as artifacts.
artifacts = ["mazebench_cli/_runtime/**"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "mazebench_cli/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "mazebench_cli/**",
    "README.md",
    "README_PYPI.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
artifacts = ["mazebench_cli/_runtime/**"]
