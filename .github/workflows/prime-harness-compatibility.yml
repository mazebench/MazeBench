name: Prime harness compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Resolve and install pinned environment
        working-directory: environments/mazebench
        run: uv sync --locked --no-editable
      - name: Discover every Prime harness
        run: |
          uv run --no-editable --project environments/mazebench python scripts/maze-prime-harness-catalog.py --write environments/mazebench/prime-harness-catalog.json
          uv run --no-editable --project environments/mazebench python scripts/maze-verify-prime-tools.py --self-test
          uv run --locked --no-editable --project environments/mazebench python3 -m unittest tests/test_game_runtime_isolation.py
          uv run --no-editable --project environments/mazebench python scripts/maze-verify-prime-resume.py --self-test
          npm run sync-runtime
          node tests/prime-native-harness.test.js
          node tests/prime-harnesses.test.js
          node tests/runtime-drift.test.js
      - name: Open compatibility update
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Already current."
            exit 0
          fi
          branch="automation/prime-harnesses-0.3.0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add environments/mazebench/pyproject.toml environments/mazebench/uv.lock environments/mazebench/prime-harness-catalog.json environments/mazebench/mazebench/runtime/environments/mazebench
          git commit -m "chore: refresh Prime harness compatibility"
          git push --force-with-lease origin "HEAD:$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh Prime harness compatibility" \
            --body "Automated compatibility refresh for Verifiers 0.3.0. The generated harness catalog and game-tool boundary checks passed."
