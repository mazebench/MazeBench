# Publish the `mazebench` package to PyPI.
#
# Trigger: publishing a GitHub Release (or manually via workflow_dispatch).
#
# One-time setup on PyPI (no API tokens needed — uses trusted publishing):
#   1. https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#   2. PyPI project name: mazebench
#      Owner:             mazebench            (this GitHub org/user)
#      Repository:        MazeBenchEngine      (this repo)
#      Workflow name:     publish.yml
#      Environment:       pypi
#   3. Create a GitHub environment named "pypi" in the repo settings.
#
# Release flow: bump `version` in pyproject.toml, tag + publish a GitHub
# Release, and this workflow builds the self-contained wheel (Node runtime
# bundled) and uploads it.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: environments/mazebench/uv.lock

      - run: npm ci

      - name: Python CLI tests
        run: python -m unittest tests/test_mazebench_cli.py

      - name: Install Chromium for vision integration tests
        run: npx playwright-core install --with-deps chromium

      - name: Node test suite
        run: npm test

      - name: Stage the Node runtime into the Python package
        run: node scripts/build-python-runtime.js

      - name: Build wheel + sdist
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Verify wheel + sdist contents
        run: python scripts/verify-python-distributions.py dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
