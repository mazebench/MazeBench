# Publish the `mazebench` package to PyPI.
#
# Trigger: publishing a GitHub Release (or manually via workflow_dispatch).
#
# One-time setup on PyPI (no API tokens needed — uses trusted publishing):
#   1. https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#   2. PyPI project name: mazebench
#      Owner:             mazebench            (this GitHub org/user)
#      Repository:        MazeBenchEngine      (this repo)
#      Workflow name:     publish.yml
#      Environment:       pypi
#   3. Create a GitHub environment named "pypi" in the repo settings.
#
# Release flow: bump `version` in pyproject.toml, tag + publish a GitHub
# Release, and this workflow builds the self-contained wheel (Node runtime
# bundled) and uploads it.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Main CI already built, verified, and wheel-smoked this exact commit on
      # Python 3.9 and 3.14. Publishing that artifact avoids rebuilding and
      # rerunning the complete browser suite after the release gate is green.
      - name: Resolve the exact successful main CI run
        id: verified-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-release-ci.js

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.verified-ci.outputs.run_id }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
